[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lean-repl-mcp"
version = "0.1.0"
description = "A small MCP wrapper around the Lean community REPL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=1.27,<2",
]

[project.scripts]
lean-repl-mcp = "lean_repl_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_repl_mcp"]

